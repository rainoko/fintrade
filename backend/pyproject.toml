[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintrade-backend"
version = "0.1.0"
description = "Stock/portfolio signal analysis backend (Elder Triple Screen methodology)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2,<3",
    "yfinance>=0.2.40",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
